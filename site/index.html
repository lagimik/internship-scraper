  input[type=search], select {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);

  label.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  .country-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

  main { padding: 16px 20px 60px; max-width: 1200px; margin: 0 auto; }
  .job {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px; display: grid;
    grid-template-columns: 1fr auto; gap: 10px; align-items: start;
  }
  .job h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .job h2 a { color: var(--fg); text-decoration: none; }
  .job h2 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .tag.mechanical-engineering, .tag.mechatronics { color: #79c0ff; }
  .tag.design-manufacturing, .tag.manufacturing-engineering { color: #7ee787; }
  .tag.materials-engineering { color: #d2a8ff; }
  .tag.project-management, .tag.program-management { color: #ffa657; }
  .tag.intern, .tag\[co-op\] { color: var(--warn); }
  .tag.amb { color: var(--warn); border-color: var(--warn); }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  button.st {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  button.st:hover { color: var(--fg); border-color: var(--accent); }
  button.st.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .runs { font-size: 12px; color: var(--muted); margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .runs .bad { color: var(--bad); }
  .runs .good { color: var(--ok); }
  a.src { color: var(--muted); text-decoration: none; }
  a.src:hover { color: var(--accent); }
  @media (max-width: 640px) { .job { grid-template-columns: 1fr; } .actions { justify-content: flex-start; } }
</style>

<script>
const data = JSON.parse(document.getElementById('dashboard-data').textContent);
const $ = (id) => document.getElementById(id);
const controls = ['q', 'source', 'category', 'type', 'region', 'sort', 'remote'];

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
}

function fillSelect(element, items) {
  const first = element.querySelector('option').outerHTML;
  element.innerHTML = first + items.map((item) =>
    `<option value="${esc(item.v)}">${esc(item.v)} (${item.n})</option>`).join('');
}

// Calendar days, not elapsed 24-hour periods.
function ago(iso) {
  if (!iso) return '';
  const then = new Date(iso);
  if (Number.isNaN(then.getTime())) return '';
  const startOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  const days = Math.round((startOfDay(new Date()) - startOfDay(then)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return `${days}d ago`;
  if (days < 365) return `${Math.floor(days / 30)}mo ago`;
  return `${Math.floor(days / 365)}y ago`;
}

function jobTime(job) {
  const time = Date.parse(job.posted_at || job.first_seen_at);
  return Number.isNaN(time) ? 0 : time;
}

function filteredJobs() {
  const query = $('q').value.trim().toLocaleLowerCase();
  const source = $('source').value;
  const category = $('category').value;
  const type = $('type').value;
  const country = document.querySelector('input[name="country"]:checked').value;
  const region = $('region').value;
  const remoteOnly = $('remote').checked;

  const jobs = data.jobs.filter((job) => {
    if (query && ![job.title, job.company, job.location]
      .some((value) => String(value ?? '').toLocaleLowerCase().includes(query))) return false;
    if (source && job.source !== source) return false;
    if (category && job.role_category !== category) return false;
    if (type && job.type !== type) return false;
    if (job.country !== country) return false;
    if (region && job.region !== region) return false;
    if (remoteOnly && !job.remote) return false;
    return true;
  });

  const direction = $('sort').value === 'oldest' ? 1 : -1;
  jobs.sort((a, b) => direction * (jobTime(a) - jobTime(b)) || a.company.localeCompare(b.company));
  return jobs;
}

function render() {
  const jobs = filteredJobs();
  const country = document.querySelector('input[name="country"]:checked').value;
  $('country-label').textContent = country === 'CA' ? 'Canada' : 'United States';
  $('count').textContent = `${jobs.length} ${country} jobs`;
  $('list').innerHTML = jobs.length ? jobs.map((job) => {
    let sources;
    try { sources = JSON.parse(job.sources); } catch { sources = [job.source]; }
    const tags = [
      job.role_category && `<span class="tag ${esc(job.role_category)}">${esc(job.role_category)}</span>`,
      job.type && `<span class="tag">${esc(job.type)}</span>`,
      `<span class="tag">${esc(job.country)}${job.region ? ` · ${esc(job.region)}` : ''}</span>`,
      job.work_term_months === 4 ? `<span class="tag">4 months${job.work_term_confidence === 'inferred' ? '?' : ''}</span>` : '',
      job.remote ? '<span class="tag">remote</span>' : '',
      job.location_confidence === 'ambiguous'
        ? `<span class="tag amb" title="Location rule: ${esc(job.location_matched_by)}">location?</span>` : '',
    ].filter(Boolean).join('');

    return `<article class="job">
      <div>
        <h2><a href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.title)}</a></h2>
        <div class="meta">
          <strong style="color:var(--fg)">${esc(job.company)}</strong>
          <span>·</span><span>${esc(job.location) || '-'}</span>
          ${job.salary_raw ? `<span>·</span><span>${esc(job.salary_raw)}</span>` : ''}
          <span>·</span><span title="${esc(job.posted_at || job.first_seen_at)}">${ago(job.posted_at || job.first_seen_at)}</span>
          <span>·</span><span>${sources.map(esc).join(' + ')}</span>
          ${tags}
        </div>
      </div>
    </article>`;
  }).join('') : '<div class="empty">No jobs match these filters.</div>';
}

fillSelect($('source'), data.facets.sources);
fillSelect($('category'), data.facets.categories);
fillSelect($('type'), data.facets.types);
fillSelect($('region'), data.facets.regions);

const generated = new Date(data.generatedAt).toLocaleString();
$('runs').innerHTML = `<strong>Static snapshot generated ${esc(generated)}.</strong> ` +
  data.facets.runs.map((run) =>
    `<span class="${run.ok ? 'good' : 'bad'}">${esc(run.source)} ${run.ok ? `✓ ${run.kept} kept` : `✗ ${esc((run.error || '').slice(0, 60))}`}</span>`
  ).join(' · ');

let timer;
for (const id of controls) {
  const element = $(id);
  const event = element.tagName === 'INPUT' && element.type === 'search' ? 'input' : 'change';
  element.addEventListener(event, () => {
    clearTimeout(timer);
    timer = setTimeout(render, event === 'input' ? 220 : 0);
  });
}
for (const input of document.querySelectorAll('input[name="country"]')) {
  input.addEventListener('change', () => { $('region').value = ''; render(); });
}

render();
</script>
