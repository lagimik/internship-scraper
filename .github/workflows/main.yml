name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Scrape and export internships"]
    types: [completed]
  workflow_dispatch:


jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
  
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish site to gh-pages
        run: |
          git subtree split --prefix site --branch pages-deploy
          git push --force origin pages-deploy:gh-pages
